[package]
name = "lancedb-rgw-store"
version = "0.1.0"
edition = "2021"
description = "LanceDB RGW backend integration"
license = "Apache-2.0"
repository = "https://github.com/ceph/ceph"
keywords = ["ceph", "rgw", "lancedb", "vector", "storage", "sal"]
categories = ["database", "api-bindings"]

[lib]
name = "lancedb_rgw_store"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# LanceDB ecosystem - versions MUST match lancedb-c to avoid ABI mismatch
# (both cdylibs share types across the vtable boundary)
lancedb = { version = "0.30", default-features = false }
lance = { version = "7.0", default-features = false }
lance-io = { version = "7.0", default-features = false }
lance-core = { version = "7.0", default-features = false }

# ObjectStore trait from Apache Arrow - must match lance-io 7.0's dependency
object_store = "0.13"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
async-trait = "0.1"
futures = "0.3"

# Data types
bytes = "=1.11.1"
url = "2"
chrono = "0.4"

# For C strings and FFI
libc = "0.2"

[build-dependencies]
# For linking to Ceph libraries
cc = "1.0"
pkg-config = "0.3"

[features]
default = []
# Enable mock SAL for testing without full Ceph
mock-sal = []

[dev-dependencies]
tokio-test = "0.4"
lazy_static = "1.4"
